name: Release

# Pushing a v<version> tag publishes neutron-ai-sdk to PyPI through trusted
# publishing: the pypi environment asks for approval, and no token is stored.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Check the tag matches the package version
        run: |
          python - "${GITHUB_REF_NAME#v}" <<'PY'
          import sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          sys.exit(0 if version == sys.argv[1] else f"pyproject.toml is {version}, the tag is {sys.argv[1]}")
          PY
      - run: PYTHONPATH=src python -m unittest discover tests
      - run: python -m pip install build && python -m build --sdist --wheel --outdir dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.0
